name: Check remaining partner websites
on:
  push:
    branches: [confirmed-card-benefits-20261024]
    paths: ['.github/workflows/partner-web-check.yml']
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public business pages
        shell: python
        run: |
          import urllib.request, urllib.parse, pathlib, json, concurrent.futures, re, html
          root=pathlib.Path('partner-check');root.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0'}
          def fetch(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=18) as r:return r.read(),r.geturl()
          urls=[
            'https://www.google.com/search?q=Jerk+Hut+Swansea&gbv=1',
            'https://www.google.com/search?q=Foundry+Swansea+discount&gbv=1',
            'https://www.google.com/search?q=Cha+Cha+Swansea+stall&gbv=1',
            'https://www.google.com/search?q=Hello+Asia+Swansea&gbv=1',
            'https://www.google.com/search?q=Velvet+Green+Swansea&gbv=1',
            'https://html.duckduckgo.com/html/?q=Jerk+Hut+Swansea',
            'https://html.duckduckgo.com/html/?q=Foundry+Swansea',
            'https://jerkhut.co.uk/',
            'https://jerkhut.uk/',
            'https://jerkhutonline.co.uk/',
            'https://www.jerkhut.co.uk/',
            'https://foundryswansea.co.uk/',
            'https://foundryswansea.com/'
          ]
          def check(pair):
            i,url=pair
            try:
              data,final=fetch(url);text=data.decode('utf-8','replace');(root/f'{i}.html').write_text(text)
              clean=re.sub(r'<(script|style)\b[^>]*>.*?</\1>','',text,flags=re.S|re.I);clean=html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',clean)))
              return {'url':url,'final':final,'text':clean[:18000]}
            except Exception as e:return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: results=list(pool.map(check,enumerate(urls)))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          logos=pathlib.Path('logos');sources=json.loads((logos/'sources.json').read_text())
          for name,url in {'dfc.png':'https://www.dfcswansea.com/site/assets/images/uploads/xdfcswansea-logo.png.pagespeed.ic.Yf4HMOmqwN.png','zazah.png':'https://zazahbuffet.co.uk/images/logo-2.png'}.items():
            data,final=fetch(url)
            if len(data)<100 or b'<html' in data[:300].lower():raise ValueError('Invalid logo '+name)
            (logos/name).write_bytes(data);sources[name]=url
          (logos/'sources.json').write_text(json.dumps(sources,indent=2))
      - name: Save logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || (git commit -m "Add official DFC and Zazah logos" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-partner-check
          path: |
            partner-check/
            logos/
          retention-days: 7
