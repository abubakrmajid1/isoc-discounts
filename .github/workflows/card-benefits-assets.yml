name: Prepare confirmed card benefits
on:
  push:
    branches: [confirmed-card-benefits-20261024]
    paths: ['.github/workflows/card-benefits-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public brand assets and website references
        shell: python
        run: |
          import urllib.request, urllib.parse, pathlib, json, concurrent.futures, re, html
          logos = pathlib.Path('logos'); logos.mkdir(exist_ok=True)
          research = pathlib.Path('partner-research'); research.mkdir(exist_ok=True)
          headers = {'User-Agent': 'Mozilla/5.0'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r:
              return r.read(), r.geturl()
          sources = json.loads((logos/'sources.json').read_text())
          images = {
            'cha-cha.jpg':'https://raw.githubusercontent.com/maroneaosman-rgb/ISOC-Discount/main/Cha%20Cha%20Stall.jpg',
            'hello-asia.jpg':'https://raw.githubusercontent.com/maroneaosman-rgb/ISOC-Discount/main/Hello%20Asia.jpg',
            'velvet-green.jpg':'https://raw.githubusercontent.com/maroneaosman-rgb/ISOC-Discount/main/VelvetGreen.jpg',
            'zazah.png':'https://raw.githubusercontent.com/maroneaosman-rgb/ISOC-Discount/main/Zazh%20Buffet.png'
          }
          for name,url in images.items():
            data,final = get(url)
            if len(data)<100 or b'<html' in data[:300].lower(): raise ValueError('Invalid brand asset: '+name)
            (logos/name).write_bytes(data); sources[name]=url
          (logos/'sources.json').write_text(json.dumps(sources,indent=2))
          urls = [
            'https://www.bing.com/search?q='+urllib.parse.quote(q)
            for q in ['DFC Swansea order online', 'Jerk Hut Swansea official order', 'Foundry Coffee Swansea address', 'Velvet Green Swansea cafe', 'Hello Asia Swansea', 'Cha Cha Swansea market']
          ] + ['https://foundry.coffee/','https://dfcswansea.co.uk/','https://dfcswansea.com/','https://jerkhutswansea.co.uk/','https://jerkhutswansea.com/','https://www.dfcswansea.co.uk/','https://zazahbuffet.co.uk/']
          def check(pair):
            i,url=pair
            try:
              data,final=get(url); text=data.decode('utf-8','replace')
              (research/(str(i)+'.html')).write_text(text)
              links = re.findall(r'href=[\"\']([^\"\']+)',text)
              images = re.findall(r'(?:src|content)=[\"\']([^\"\']+(?:\.png|\.jpg|\.jpeg|\.svg|\.webp)[^\"\']*)',text)
              plain=re.sub('<[^>]+>',' ',text); plain=html.unescape(re.sub(r'\s+',' ',plain))
              print('SOURCE',url,'FINAL',final,'TEXT',plain[:12000], 'IMAGES',images[:30])
              return {'url':url,'final':final,'links':links,'images':images,'text':plain[:20000]}
            except Exception as e:
              print('SOURCE',url,'ERROR',str(e)); return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            results=list(pool.map(check,enumerate(urls)))
          (research/'references.json').write_text(json.dumps(results,indent=2))
      - name: Save partner logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || (git commit -m "Add supplied logos for Cha Cha, Hello Asia, Velvet Green and Zazah" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: confirmed-partner-assets-and-references
          path: |
            logos/
            partner-research/
          retention-days: 7
